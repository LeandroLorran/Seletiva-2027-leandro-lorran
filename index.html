<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <link rel="stylesheet" href="login.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jacques+Francois&display=swap"
      rel="stylesheet"
    />

    <script defer src="script.js"></script>
  </head>
  <body>
    <div class="divPagina">
      <div class="divLogin">
        <img src="asset/Group.png" alt="" />
        <h1>Music Hall</h1>
        <div class="divInput">
          <label for="">E-mail:</label>
          <input type="email" placeholder="Digite seu e-mail ou CPF." required />
        </div>
        <div class="divInput">
          <label for="">Senha:</label>
          <input class="inputsenha" type="password" placeholder="Digite sua Senha." required />
        </div>
        <p><button>Esqueceu sua senha?</button></p>

        <div class="divButoes">
          <button>Entrar</button>
          <button>Cadastrar</button>
        </div>

        
      </div>
    </div>
  </body>
</html>
